<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17070d">
  <title>Love, in Every Language</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #17070d;
      --paper: #f5e9e9;
      --muted: #b89da5;
      --line: #56313d;
      --rose: #fb7185;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100svh;
      margin: 0;
      color: var(--paper);
      background:
        radial-gradient(ellipse at 50% 55%, #42111f 0, #260b15 34%, var(--ink) 73%),
        var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }

    .page {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      width: min(100%, 1100px);
      min-height: 100svh;
      margin-inline: auto;
      padding: clamp(18px, 4vw, 38px) clamp(18px, 5vw, 56px) 20px;
    }

    header, footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .eyebrow, .caption, .control {
      font-family: "Segoe UI", Arial, sans-serif;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: #e6a3b1;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(22px, 4vw, 34px);
      font-weight: 400;
      line-height: 1.1;
    }

    .control {
      display: inline-flex;
      min-width: 104px;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--paper);
      background: #2a1019;
      font-size: 13px;
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease;
    }

    .control:hover { border-color: var(--rose); background: #38131f; }
    .control:focus-visible { outline: 2px solid var(--rose); outline-offset: 3px; }
    .control svg { width: 15px; height: 15px; fill: currentColor; }

    main {
      display: grid;
      min-height: 0;
      place-items: center;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 360px;
    }

    footer {
      min-height: 38px;
      border-top: 1px solid rgb(230 163 177 / 18%);
      color: var(--muted);
    }

    .caption { margin: 0; font-size: 12px; }
    .language-count { color: #e6a3b1; font-size: 12px; }

    @media (max-width: 520px) {
      .page { padding-bottom: 14px; }
      header { align-items: flex-end; }
      .control { min-width: 42px; padding-inline: 12px; }
      .control .label { display: none; }
      canvas { min-height: 300px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div>
        <p class="eyebrow">A little love, everywhere</p>
        <h1>Love, in every language</h1>
      </div>
      <div style="display:flex; gap:8px">
        <button class="control" id="replay" type="button" aria-label="Replay animation" title="Replay animation">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2a6 6 0 1 0 5.7 8h-2.1A4 4 0 1 1 8 4c1.1 0 2.1.45 2.83 1.17L9 7h5V2l-1.75 1.75A5.97 5.97 0 0 0 8 2z"/></svg>
          <span class="label">Replay</span>
        </button>
        <button class="control" id="toggle" type="button" aria-label="Pause animation" title="Pause animation">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 3h3v10H4zm5 0h3v10H9z"/></svg>
          <span class="label">Pause</span>
        </button>
      </div>
    </header>

    <main>
      <canvas id="art" role="img" aria-label="An animated heart made from the words I love you in 20 languages"></canvas>
    </main>

    <footer>
      <p class="caption">One feeling. A thousand ways to say it.</p>
      <span class="language-count">20 languages</span>
    </footer>
  </div>

  <script src="./name.js"></script>
  <script>
    const canvas = document.querySelector("#art");
    const ctx = canvas.getContext("2d");
    const toggle = document.querySelector("#toggle");
    const replay = document.querySelector("#replay");
    const lovedName = (window.LOVED_NAME || "").trim();
    const phrases = [
      "I love you", "Seni seviyorum", "Te amo", "Je t'aime",
      "Ich liebe dich", "Ti amo", "Eu te amo", "Я тебя люблю",
      "사랑해", "愛してる", "我爱你", "मैं तुमसे प्यार करता हूँ",
      "Σ' αγαπώ", "Ik hou van jou", "Jag älskar dig", "Kocham cię",
      "ฉันรักเธอ", "Anh yêu em", "Aku cinta kamu", "Я тебе кохаю"
    ];
    const sizes = [9, 10, 11, 12];
    const colors = ["#971d3a", "#dc3150", "#fa5368", "#ff8c9b"];
    const points = [];
    let entries = [];
    let startedAt = performance.now();
    let pausedAt = 0;
    let paused = false;
    let frame = 0;
    let width = 0;
    let height = 0;
    let scale = 1;
    let rowHeight = 17;
    let heartTop = 0;

    function heart(angle) {
      return {
        x: 16 * Math.sin(angle) ** 3,
        y: 13 * Math.cos(angle) - 5 * Math.cos(2 * angle)
          - 2 * Math.cos(3 * angle) - Math.cos(4 * angle)
      };
    }

    for (let index = 0; index < 720; index++) {
      points.push(heart(2 * Math.PI * index / 720));
    }

    function intersections(y) {
      const xs = [];
      for (let index = 0; index < points.length; index++) {
        const first = points[index];
        const second = points[(index + 1) % points.length];
        if ((first.y <= y && y < second.y) || (second.y <= y && y < first.y)) {
          xs.push(first.x + (y - first.y) * (second.x - first.x) / (second.y - first.y));
        }
      }
      xs.sort((a, b) => a - b);
      const spans = [];
      for (let index = 0; index + 1 < xs.length; index += 2) {
        spans.push([xs[index], xs[index + 1]]);
      }
      return spans;
    }

    function layout() {
      const box = canvas.getBoundingClientRect();
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      width = box.width;
      height = box.height;
      canvas.width = Math.round(width * ratio);
      canvas.height = Math.round(height * ratio);
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      scale = Math.min((width - 34) / 32, (height - 28) / 30, 19);
      rowHeight = Math.max(15, scale * 0.86);
      heartTop = (height - 29 * scale) / 2;

      const rows = [];
      for (let localY = 12.2; localY > -16.4; localY -= rowHeight / scale) {
        const spans = intersections(localY);
        for (const [left, right] of spans) {
          const inset = 0.35;
          const start = (left + inset) * scale;
          const end = (right - inset) * scale;
          if (end - start > 28) rows.push({ y: localY, left: start, right: end });
        }
      }

      const placed = [];
      let phraseIndex = 0;
      for (const row of rows) {
        let cursor = row.left + Math.random() * 7;
        const line = [];
        while (cursor < row.right - 14) {
          let choice;
          for (let attempt = 0; attempt < phrases.length; attempt++) {
            const phrase = `${phrases[phraseIndex++ % phrases.length]}${lovedName ? ` ${lovedName}` : ""}`;
            const size = sizes[Math.floor(Math.random() * sizes.length)];
            ctx.font = `700 ${size}px Arial, sans-serif`;
            const measured = ctx.measureText(phrase).width;
            if (cursor + measured <= row.right) {
              choice = { phrase, size, measured };
              break;
            }
          }
          if (!choice) break;
          line.push({ ...choice, x: cursor + choice.measured / 2, y: row.y });
          cursor += choice.measured + 7;
        }
        if (line.length > 1) {
          const extra = row.right - (line[line.length - 1].x + line[line.length - 1].measured / 2);
          line.forEach((item, index) => item.x += extra * index / (line.length - 1));
        } else if (line.length === 1) {
          line[0].x = (row.left + row.right) / 2;
        }
        line.forEach((item, index) => placed.push({ ...item, edge: index === 0 || index === line.length - 1 }));
      }

      const outer = placed.filter(item => item.edge);
      const inner = placed.filter(item => !item.edge);
      outer.sort((a, b) => Math.atan2(a.x, a.y) - Math.atan2(b.x, b.y));
      inner.sort(() => Math.random() - 0.5);
      entries = [...outer, ...inner].map((item, index, list) => ({
        ...item,
        color: colors[Math.min(colors.length - 1, Math.floor(Math.random() * colors.length))],
        start: 500 + index * (9200 / Math.max(1, list.length)),
        drift: (Math.random() - 0.5) * 18,
        sparkle: Math.random() * 5000
      }));
      startedAt = performance.now();
    }

    function draw(now) {
      if (paused) return;
      ctx.clearRect(0, 0, width, height);
      const elapsed = now - startedAt;
      for (const item of entries) {
        const progress = Math.max(0, Math.min(1, (elapsed - item.start) / 1000));
        if (progress <= 0) continue;
        const eased = 1 - (1 - progress) ** 3;
        const x = width / 2 + item.x + item.drift * (1 - eased);
        const y = heartTop + (14.5 - item.y) * scale + (1 - eased) * 30;
        const shimmer = progress === 1 ? Math.max(0, Math.sin((now + item.sparkle) / 580)) * 0.52 : 0;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = `700 ${item.size}px Arial, sans-serif`;
        ctx.shadowColor = item.color;
        ctx.shadowBlur = progress === 1 ? 4 + shimmer * 9 : 2;
        ctx.globalAlpha = eased;
        ctx.fillStyle = item.color;
        ctx.fillText(item.phrase, x, y);
        if (shimmer > 0.46) {
          ctx.globalAlpha = (shimmer - 0.46) * 1.7;
          ctx.fillStyle = "#ffe2e5";
          ctx.fillText(item.phrase, x, y);
        }
      }
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
      frame = requestAnimationFrame(draw);
    }

    function setPaused(value) {
      paused = value;
      toggle.setAttribute("aria-label", paused ? "Play animation" : "Pause animation");
      toggle.title = paused ? "Play animation" : "Pause animation";
      toggle.querySelector(".label").textContent = paused ? "Play" : "Pause";
      toggle.querySelector("svg").innerHTML = paused
        ? '<path d="M5 3.5a.8.8 0 0 1 1.2-.7l6.3 4.5a.85.85 0 0 1 0 1.4l-6.3 4.5a.8.8 0 0 1-1.2-.7z"/>'
        : '<path d="M4 3h3v10H4zm5 0h3v10H9z"/>';
      if (paused) {
        pausedAt = performance.now();
        cancelAnimationFrame(frame);
      } else {
        startedAt += performance.now() - pausedAt;
        frame = requestAnimationFrame(draw);
      }
    }

    toggle.addEventListener("click", () => setPaused(!paused));
    replay.addEventListener("click", () => {
      if (paused) setPaused(false);
      layout();
      cancelAnimationFrame(frame);
      frame = requestAnimationFrame(draw);
    });
    window.addEventListener("resize", () => {
      layout();
      if (!paused) {
        cancelAnimationFrame(frame);
        frame = requestAnimationFrame(draw);
      }
    });

    layout();
    frame = requestAnimationFrame(draw);
  </script>
</body>
</html>
